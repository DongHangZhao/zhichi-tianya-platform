# Render 蓝图：https://render.com/docs/blueprint-spec
# 把本仓库连到 Render 后会自动创建 Web 服务 + PostgreSQL。
# 若只想用 SQLite，删除下方 databases 段与 DATABASE_URL 段即可。

services:
  - type: web
    name: zhichi-tianya
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true          # Render 自动生成随机密钥
      - key: DATABASE_URL
        fromDatabase:
          name: zhichi-db
          property: connectionString

databases:
  - name: zhichi-db
    plan: free
    databaseName: zhichi
    user: zhichi
